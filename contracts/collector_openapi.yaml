# C2 — Collector API: Simulator -> API -> Kafka ecom.events.raw. Trạng thái: REVIEW (TV4 soạn, chờ TV2 duyệt).
# Kiểm tra: tests/test_schemas.py (contract) + tests/test_collector_api.py (pytest + httpx, TV2).
openapi: 3.0.3
info:
  title: Collector API
  version: 0.1.0
  description: Đường nạp HTTP mô phỏng web/app thật. Mỗi phần tử trong lô theo contract C3 (event.schema.json).
x-kafka:
  topic: ecom.events.raw
  key: user_id            # mọi sự kiện của một người dùng vào cùng partition
  max_batch: 500          # = configs/pipeline.yaml -> collector.max_batch
paths:
  /events:
    post:
      operationId: postEvents
      summary: Nhận lô sự kiện, kiểm tra schema (Pydantic), đẩy vào Kafka
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items: {$ref: "./event.schema.json"}
      responses:
        "202":
          description: Toàn bộ lô hợp lệ, đã gửi vào Kafka (acks=all). Lô là nguyên tử — không gửi một phần.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties: {accepted: {type: integer, minimum: 1, maximum: 500}}
        "400":
          description: Lô rỗng, > 500 phần tử, hoặc có phần tử sai schema C3; không phần tử nào được gửi
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [index, message]
                      properties:
                        index: {type: integer, description: "vị trí phần tử lỗi trong lô, -1 nếu lỗi cả lô (rỗng / quá 500)"}
                        field: {type: string, description: "tên trường sai, bỏ trống nếu lỗi cả lô"}
                        message: {type: string}
        "503":
          description: Không gửi được vào Kafka (không broker nào trong ISR); client thử lại sau
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service sống (không kiểm tra Kafka)
          content:
            application/json:
              schema:
                type: object
                properties: {status: {type: string, enum: [ok]}}
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus text format
      responses:
        "200":
          description: OK
          content:
            text/plain: {}
