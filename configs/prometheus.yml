global:
  scrape_interval: 5s

scrape_configs:
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: collector-api
    static_configs: [{targets: ["collector-api:8000"]}]
  - job_name: simulator            # simulator chạy trên host, mở /metrics ở 8001
    static_configs: [{targets: ["host.docker.internal:8001"]}]
  - job_name: spark-stream         # StreamingQueryListener -> prometheus_client trong driver
    static_configs: [{targets: ["spark-master:8002"]}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: ["minio:9000"]}]
