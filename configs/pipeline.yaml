# Cấu hình dùng chung cho simulator, producer, Collector API, Spark. Đọc qua src/common/config.py.

kafka:
  bootstrap_servers: localhost:29092,localhost:29093,localhost:29094   # từ máy host
  bootstrap_servers_internal: kafka-1:9092,kafka-2:9092,kafka-3:9092   # từ trong Docker
  topic: ecom.events.raw

producer:            # confluent-kafka, thay đổi trong E1
  enable.idempotence: true
  acks: all
  compression.type: lz4
  linger.ms: 20
  batch.size: 262144

simulator:
  source: s3://lake/raw/csv/   # CSV tải tay từ Kaggle, đẩy lên bằng `make upload`; đọc qua s3fs với lake.endpoint_host
  files: [2019-Nov.csv]        # ưu tiên 1; thêm 2019-Oct.csv (ưu tiên 2) khi mở rộng Full — xem README "Dữ liệu nguồn"
  chunk_size: 100000
  speed: 100           # hệ số tăng tốc theo event_time; 0 = tối đa (có rate limit)
  max_rate: 50000      # sự kiện/s khi speed = 0
  mode: producer       # producer | http
  fault_injection:
    enabled: false
    corrupt_ratio: 0.001
    duplicate_ratio: 0.001
    seed: 42

collector:
  url: http://localhost:8000/events
  max_batch: 500

lake:
  bucket: lake
  endpoint: http://minio:9000            # từ trong Docker (Spark, Connect)
  endpoint_host: http://localhost:9002   # từ máy host (simulator, make_sample)
  raw_csv: s3a://lake/raw/csv/           # CSV gốc tải tay
  raw: s3a://lake/raw/ecom.events.raw/   # JSON gzip từ Kafka Connect
  bronze: s3a://lake/bronze/events/
  quarantine: s3a://lake/quarantine/events/
  checkpoints: s3a://lake/_checkpoints/

stream:
  source: kafka        # kafka continuous streaming | sample finite batch
  sample_path: /opt/app/data/sample/events_sample_100k.csv
  sample_rows: 100000
  sample_day: '2019-11-01'
  sample_bronze_path: s3a://lake/bronze/sample_events/
  trigger_seconds: 10
  watermark: 1 hour
  max_offsets_per_trigger: 500000
  starting_offsets: earliest   # chỉ áp dụng lần đầu; sau đó resume từ checkpoint
  checkpoint_path: s3a://lake/_checkpoints/kafka_to_delta/
  query_name: clickflow-kafka-to-delta
  metrics_port: 8002
