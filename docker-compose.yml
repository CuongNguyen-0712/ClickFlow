# Profile mặc định = core. `make up` thêm --profile monitoring (Prometheus, Grafana, kafka-exporter).
# Heap mỗi broker giới hạn 512 MB để cả stack chạy trên máy 16 GB.

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

x-kafka: &kafka
  image: apache/kafka:3.8.1
  restart: unless-stopped
  # shortcut: log Kafka nằm trong container (không volume), `make down` xoá dữ liệu; raw/ mới là nơi lưu lâu dài
  healthcheck:
    test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
    interval: 10s
    timeout: 10s
    retries: 12

x-spark: &spark
  build: docker/spark
  image: ecom/spark:3.5.3
  environment: &spark-env
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
  volumes:
    - ./src:/opt/app/src
    - ./configs:/opt/app/configs
    - ./queries:/opt/app/queries
    - ./data:/opt/app/data
    - ./configs/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

services:
  # ---------- Ingestion ----------
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:29092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["29093:29093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29093

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["29094:29094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:29094

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      KAFKA_CLUSTERS_0_NAME: ecom
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  kafka-connect:
    build: docker/connect
    image: ecom/kafka-connect:7.7.1
    ports: ["8083:8083"]
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: ecom-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      KAFKA_HEAP_OPTS: -Xmx768m -Xms512m

  collector-api:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ecom/collector-api:dev
    ports: ["8000:8000"]
    depends_on:
      kafka-1: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092

  # ---------- Storage ----------
  # minio/minio và quay.io/minio/* không còn pull được; dùng Chainguard (có sẵn mc, sh), ghim theo digest
  minio:
    image: &minio-image cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: server /data --console-address ":9001"
    ports: ["9002:9000", "9003:9001"]   # 9000/9001 trên host thường bị project khác chiếm; trong mạng Docker vẫn là minio:9000
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      LAKE_BUCKET: ${LAKE_BUCKET}
    volumes:
      - minio-data:/data
      - ./data/raw:/upload:ro      # cho `make upload`: CSV tải tay -> lake/raw/csv/
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 12

  minio-init:
    image: *minio-image
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${LAKE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}

  spark-master:
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8090:8080", "7077:7077", "4040:4040"]

  spark-worker-1: &spark-worker
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g

  spark-worker-2:
    <<: *spark-worker

  # ---------- Monitoring ----------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [monitoring]
    command: ["--kafka.server=kafka-1:9092", "--kafka.server=kafka-2:9092", "--kafka.server=kafka-3:9092"]
    depends_on:
      kafka-1: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    ports: ["9090:9090"]
    volumes: [./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./src/monitoring/grafana:/var/lib/grafana/dashboards:ro

volumes:
  minio-data:
